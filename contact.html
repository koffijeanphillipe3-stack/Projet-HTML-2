<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulaire de contact html</title>
    </head>
    <body>
        
        <!-- Ceci est un formulaire de contact  -->
         <section id="contact">
            <!-- contact -->
            <h2>Contactez-nous</h2>
            <form action="Post">

                <label for="nom">Nom:</label>
                <input type="text" id="nom" name="nom" placeholder="Entrez votre nom" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
                <br><br>
                <label for="tel">Numéro de téléphone:</label>
                <input type="tel" id="tel" name="numéro de téléphone" placeholder="Entrez votre numéro de téléphone" required>
                <br><br>
                <label for="">Photo d'identité</label>
                <input type="file" id="file" name="Photo d'identité" placeholder="Entrez votre photo d'identité" required>
                <br><br>
                <label for="message">Message..</label>
            </form>
         </section>
    </body>
</html>
